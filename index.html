<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FrameShift by JaneChe</title>
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #888888);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--hint-color);
            font-size: 14px;
        }

        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .slot {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.05);
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slot-label {
            font-size: 12px;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .slot-value {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
            transition: opacity 0.1s ease;
        }

        /* Анимация прокрутки */
        .rolling .slot-value {
            opacity: 0.5;
            transform: scale(0.98);
        }

        /* Карточка с композицией */
        .composition-card {
            width: 100%;
            max-width: 400px;
            background-color: rgba(51, 144, 236, 0.1); /* Легкий оттенок акцентного цвета */
            border-left: 4px solid var(--button-color);
            border-radius: 0 12px 12px 0;
            padding: 16px;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            display: none; /* Скрыта до первой генерации */
        }

        .composition-card.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .comp-title {
            font-size: 13px;
            color: var(--button-color);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .comp-text {
            font-size: 15px;
            line-height: 1.4;
            color: var(--text-color);
        }

        /* Кнопка для веб-версии (скрывается в ТГ, если используется MainButton) */
        .generate-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(51, 144, 236, 0.3);
            transition: transform 0.1s;
        }

        .generate-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <header>
        <h1>FrameShift by JaneChe</h1>
        <p class="subtitle">Генератор креативных ограничений</p>
    </header>

    <div class="slots-container">
        <div class="slot">
            <div class="slot-label">Свет</div>
            <div class="slot-value" id="slot-light">Нажмите кнопку</div>
        </div>
        <div class="slot">
            <div class="slot-label">Ракурс</div>
            <div class="slot-value" id="slot-angle">чтобы получить</div>
        </div>
        <div class="slot">
            <div class="slot-label">Ограничение</div>
            <div class="slot-value" id="slot-constraint">вводные данные</div>
        </div>
    </div>

    <div class="composition-card" id="comp-card">
        <div class="comp-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-9 5 18 3-9h5"/></svg>
            Совет по композиции
        </div>
        <div class="comp-text" id="comp-text">Здесь будет правило композиции</div>
    </div>

    <!-- Резервная кнопка, если открыто не в Telegram -->
    <button class="generate-btn" id="fallback-btn" onclick="startRoll()">Сгенерировать идею</button>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Скрываем обычную кнопку, если мы в Telegram, и показываем нативную
        const fallbackBtn = document.getElementById('fallback-btn');
        if (tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length > 0) {
            fallbackBtn.style.display = 'none';
            tg.MainButton.setText("СГЕНЕРИРОВАТЬ ИДЕЮ");
            tg.MainButton.show();
            tg.MainButton.onClick(startRoll);
        }

        // Базы данных
        const dbLight = [
            'Жесткий свет + цветной фильтр', 'Только контровой свет', 
            'Вспышка в лоб (стиль папарацци)', 'Один источник строго сверху', 
            'Свет через жалюзи (Гобо)', 'Мягкий свет только от окна',
            'Отраженный свет от стены', 'Длинная выдержка со смешанным светом'
        ];

        const dbAngle = [
            'Съемка от самого пола', 'Максимально сверху (вид птицы)', 
            'Голландский угол (наклон камеры)', 'Через передний план (фрейминг)', 
            'Крупный план фактуры / макро', 'Уровень груди', 
            'Съемка из-за укрытия/предмета'
        ];

        const dbConstraint = [
            'Модель не использует руки в кадре', 'В кадре только один предмет мебели', 
            'Съемка в движении (добавить смаз)', 'Лицо скрыто (тенью или предметом)', 
            'Использовать отражение (зеркало, телефон, стекло)', 
            'Сильная асимметрия в позировании', 'Снимать только через видоискатель (не смотря на экран)'
        ];

        const dbComposition = [
            { name: 'Негативное пространство', desc: 'Оставьте 70-80% кадра пустым (небо, чистый фон). Это подчеркнет объект и добавит воздуха.' },
            { name: 'Ведущие линии', desc: 'Найдите в локации линии (перила, тени, архитектуру), которые будут вести взгляд зрителя прямо к модели.' },
            { name: 'Естественный фрейминг', desc: 'Снимайте через арку, дверной проем, ветки или элементы студии, чтобы создать "рамку в рамке".' },
            { name: 'Правило третей (классика)', desc: 'Разместите ключевой элемент (глаз модели или главный акцент) строго на пересечении линий третей.' },
            { name: 'Центральная симметрия', desc: 'Забудьте про трети. Поместите модель идеально по центру кадра, создав строгий баланс левого и правого.' },
            { name: 'Диагонали', desc: 'Выстройте геометрию кадра или позу модели по диагонали — это добавит кадру кинематографичной динамики.' },
            { name: 'Многоплановость', desc: 'Обязательно включите в кадр объекты на переднем (размытом) и заднем планах, чтобы создать визуальный объем.' }
        ];

        // Элементы интерфейса
        const elLight = document.getElementById('slot-light');
        const elAngle = document.getElementById('slot-angle');
        const elConstraint = document.getElementById('slot-constraint');
        const compCard = document.getElementById('comp-card');
        const compText = document.getElementById('comp-text');
        
        let isRolling = false;

        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function startRoll() {
            if (isRolling) return;
            isRolling = true;

            // Скрываем карточку композиции на время прокрутки
            compCard.classList.remove('visible');

            // Виброотклик Telegram (если доступен)
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            document.querySelectorAll('.slot').forEach(s => s.classList.add('rolling'));

            let iterations = 0;
            const maxIterations = 15; // Сколько раз моргнет текст
            
            const rollInterval = setInterval(() => {
                elLight.innerText = getRandomItem(dbLight);
                elAngle.innerText = getRandomItem(dbAngle);
                elConstraint.innerText = getRandomItem(dbConstraint);
                
                iterations++;
                if (iterations >= maxIterations) {
                    clearInterval(rollInterval);
                    finishRoll();
                }
            }, 80); // Скорость прокрутки
        }

        function finishRoll() {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('rolling'));
            
            // Финальные значения
            const finalConstraint = getRandomItem(dbConstraint);
            elLight.innerText = getRandomItem(dbLight);
            elAngle.innerText = getRandomItem(dbAngle);
            elConstraint.innerText = finalConstraint;

            // Выбираем правило композиции
            const comp = getRandomItem(dbComposition);
            
            // Формируем умный текст, связывающий правило и текущее ограничение
            compText.innerHTML = `Попробуйте использовать <b>${comp.name}</b>: ${comp.desc} В сочетании с задачей «<i>${finalConstraint.toLowerCase()}</i>» это заставит зрителя дольше рассматривать снимок.`;

            // Показываем карточку композиции с задержкой
            setTimeout(() => {
                compCard.classList.add('visible');
                // Виброотклик об успешной генерации
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }, 200);

            isRolling = false;
        }
    </script>
</body>
</html>
